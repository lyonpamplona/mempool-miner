name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RPC_USER: test_user
      RPC_PASSWORD: test_password
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Validar Python
        run: |
          python -m compileall -q backend/app
          ruff check .
          ruff format --check .
          pytest -q
          python scripts/validate_docs.py

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar JavaScript
        run: |
          node --check frontend/game.js
          node --check docs/api-page.js

  compose-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar e validar o Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Construir imagens
        run: docker compose build --pull

      - name: Iniciar a stack
        run: docker compose up -d --wait --wait-timeout 600

      - name: Executar smoke tests
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8010/api/health
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"

      - name: Coletar logs em caso de falha
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Encerrar a stack efêmera
        if: always()
        run: docker compose down --volumes --remove-orphans
