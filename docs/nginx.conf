server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'none'; style-src 'self'" always;

    location = /healthz {
        access_log off;
        expires -1;
        return 204;
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /api {
        return 308 /api/;
    }

    location = /api/ {
        try_files /api/index.html =404;
        expires -1;
    }

    location = /apresentacao {
        return 308 /apresentacao/;
    }

    location = /apresentacao/ {
        try_files /apresentacao/index.html =404;
        expires -1;
    }

    # Redirecionamentos mínimos dos endereços publicados antes da separação.
    location = /apresentacao.html {
        return 308 /apresentacao/;
    }

    location = /docs {
        return 308 /;
    }

    location = /docs/ {
        return 308 /;
    }

    location = /docs/index.html {
        return 308 /;
    }

    location = /docs/api.html {
        return 308 /api/;
    }

    # Swagger/OpenAPI bruto e documentos Markdown não pertencem ao site público.
    location = /openapi.json {
        return 404;
    }

    location ^~ /backend-docs {
        return 404;
    }

    location ~* \.md$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
