server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'none'; style-src 'self'" always;

    location = /healthz {
        access_log off;
        expires -1;
        return 204;
    }

    # Documentação servida em /docs/ (mesma estrutura da integração no /8010).
    location = /docs {
        return 308 /docs/;
    }

    location = /docs/ {
        try_files /docs/index.html =404;
        expires -1;
    }

    location = /docs/api {
        return 308 /docs/api/;
    }

    location = /docs/api/ {
        try_files /docs/api/index.html =404;
        expires -1;
    }

    location = /docs/apresentacao {
        return 308 /docs/apresentacao/;
    }

    location = /docs/apresentacao/ {
        try_files /docs/apresentacao/index.html =404;
        expires -1;
    }

    location ^~ /docs/ {
        try_files $uri $uri/ =404;
    }

    # A raiz redireciona para /docs/ (estrutura unificada com o /8010).
    location = / {
        return 308 /docs/;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
    }
}
