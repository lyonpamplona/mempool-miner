<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Mempool Miner</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#202026"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="#f7931a" stroke-width="22" opacity=".28"/>
  <circle class="pulse" cx="256" cy="256" r="120" fill="#f7931a"/>
  <path d="M203 155v202m53-202v202m-80-163h128c45 0 45 61 3 61H184h133c48 0 48 67-3 67H176" fill="none" stroke="#050505" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="orbit" d="M91 256A165 165 0 0 1 256 91" fill="none" stroke="#fde047" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 256px 256px; }
      .orbit { animation: orbit 4s linear infinite; transform-origin: 256px 256px; }
      @keyframes pulse { 50% { transform: scale(.94); } }
      @keyframes orbit { to { transform: rotate(360deg); } }
    }
  </style>
</svg>
